name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  desktop:
    name: Desktop build and self-check (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build ApiScout/ApiScout.csproj -c Release -nologo
      # --offline: no directory scans or live requests; the update-source checks that need a .git of their own skip themselves
      - name: Self-check
        run: dotnet run --project ApiScout.Tests/ApiScout.Tests.csproj -c Release --no-build -- --offline

  mobile:
    name: Android analyze and test (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ApiScoutMobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
